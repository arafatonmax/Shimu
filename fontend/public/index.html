
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shimu Chatrabas | Meal Management</title>

    <link rel="stylesheet" href="../style/style.css">
</head>
<body style="background-image: url('./img/bg-home.jpg'); background-repeat: no-repeat; background-position: center; background-size: cover;">

    <main class="container">

        <section class="login-card">

            <div class="logo">
                <div class="logo-icon">S</div>
                <h1>Shimu Chatrabas</h1>
                <p>Meal Management System</p>
            </div>

            <div class="welcome">
                <h2>Welcome Back!</h2>
                <p>Login to manage your meals and accounts.</p>
            </div>

            <form>
                <div class="form-group">
                    <label for="userIndex">User Index</label>
                    <input
                        type="text"
                        id="userIndex"
                        placeholder="Enter your user index"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit">Login <span>→</span></button>
            </form>

            <div class="footer">
                <p>Shimu Chatrabas</p>
                <span>Simple • Organized • Transparent</span>
            </div>

        </section>

    </main>

</body>
</html>
